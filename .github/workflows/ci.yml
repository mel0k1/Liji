name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: Проверка скриптов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

      - name: Синтаксис bash
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

  docs:
    name: Проверка документации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Целостность ссылок в README
        run: |
          for path in $(grep -oE '\]\((docs|scripts|assets|products|mejo)/[^)]+\)' README.md | sed 's/^](//; s/)$//'); do
            test -e "$path" || { echo "битая ссылка: $path"; exit 1; }
          done

  mejo:
    name: Анализ Mejo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mejo
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
